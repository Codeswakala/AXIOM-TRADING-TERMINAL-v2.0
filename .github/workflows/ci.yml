name: AXIOM CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d axiom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      AXIOM_ENVIRONMENT: testing
      AXIOM_DATABASE_URL: postgresql+asyncpg://axiom:axiom@localhost:5432/axiom
      AXIOM_DATABASE_AUTO_CREATE_SCHEMA: "false"
      AXIOM_JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters
      AXIOM_ALLOW_INSECURE_DEV: "true"
      AXIOM_BOOTSTRAP_ADMIN_ENABLED: "true"
      AXIOM_BOOTSTRAP_ADMIN_USERNAME: admin
      AXIOM_BOOTSTRAP_ADMIN_PASSWORD: admin123
      AXIOM_LIVE_MARKET_AUTO_START: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade (Postgres clean path)
        run: alembic upgrade head
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          # Unit suite uses in-memory SQLite via conftest; this job still validates Alembic on PG
          AXIOM_DATABASE_URL: sqlite+aiosqlite:///:memory:
          AXIOM_DATABASE_AUTO_CREATE_SCHEMA: "true"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx tsc -b --pretty false
      - run: npm run build
